<script>
const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d');
const P={W:1080,H:1920,fps:12,nf:48,bg:'#ffffff'};
let layers=[],sel=-1,f=0,playing=false,mode='move',act=null,selB=-1,rs=null,last=0,snap=false;
const mul=(m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]];
const ap=(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
const rotAt=(t,p)=>{const s=Math.sin(t),k=Math.cos(t);return[k,s,-s,k,p[0]-k*p[0]+s*p[1],p[1]-s*p[0]-k*p[1]]};

const LM=L=>{const k=Math.cos(L.rot),n=Math.sin(L.rot),sx=L.s*L.fx,sy=L.s*L.ar*L.fy;return mul([k*sx,n*sx,-n*sy,k*sy,L.x,L.y],[1,0,0,1,-L.w/2,-L.h/2])};

function sd(x,y,a,e){const dx=e[0]-a[0],dy=e[1]-a[1];let t=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));return Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y)}

const z=document.createElement('canvas');z.width=w;z.height=h;const x0=z.getContext('2d',{willReadFrequently:true});x0.drawImage(L.img,0,0);const al=x0.getImageData(0,0,w,h).data;
const n=nx*ny,rest=new Float32Array(n*2),a0=new Uint8Array(n),a1=new Uint8Array(n),b0=new Float32Array(n),b1=new Float32Array(n);
for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const v=j*nx+i,x=Math.min(i*st,w),y=Math.min(j*st,h);rest[v*2]=x;rest[v*2+1]=y;let p=0,q=0,wp=0,wq=0;
L.bones.forEach((b,k)=>{const t=1/Math.pow(sd(x,y,b.a,b.e)+eps,3);if(t>wp){q=p;wq=wp;p=k;wp=t}else if(t>wq){q=k;wq=t}});const s=wp+wq,nb=L.bones.length;a0[v]=p;a1[v]=q;b0[v]=nb?wp/s:1;b1[v]=nb?wq/s:0}
const T=[];for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){let vis=false;const xs=i*st|0,ys=j*st|0;
for(let y=ys;y<Math.min(ys+st+1,h)&&!vis;y+=3)for(let x=xs;x<Math.min(xs+st+1,w);x+=3)if(al[(y*w+x)*4+3]>8){vis=true;break}
if(vis){const a=j*nx+i;T.push(a,a+1,a+nx,a+1,a+nx+1,a+nx)}}
L.mesh={rest,a0,a1,b0,b1,T:Uint16Array.from(T)}}
function drawMesh(L,M){const m=L.mesh,n=m.rest.length/2,Q=new Float32Array(n*2),S=m.rest;
for(let v=0;v<n;v++){const x=S[v*2],y=S[v*2+1],p=ap(M[m.a0[v]],x,y),q=ap(M[m.a1[v]],x,y);Q[v*2]=p[0]*m.b0[v]+q[0]*m.b1[v];Q[v*2+1]=p[1]*m.b0[v]+q[1]*m.b1[v]}
const T=m.T;for(let t=0;t<T.length;t+=3){const a=T[t],b=T[t+1],d=T[t+2],sx=S[a*2],sy=S[a*2+1],ux=S[b*2]-sx,uy=S[b*2+1]-sy,vx=S[d*2]-sx,vy=S[d*2+1]-sy,det=ux*vy-vx*uy;if(!det)continue;
const dx=Q[a*2],dy=Q[a*2+1],px=Q[b*2]-dx,py=Q[b*2+1]-dy,qx=Q[d*2]-dx,qy=Q[d*2+1]-dy,A=(px*vy-qx*uy)/det,C=(qx*ux-px*vx)/det,B=(py*vy-qy*uy)/det,D=(qy*ux-py*vx)/det;
const mx=(dx+Q[b*2]+Q[d*2])/3,my=(dy+Q[b*2+1]+Q[d*2+1])/3,ex=(X,Y)=>{const u=X-mx,w=Y-my,l=Math.hypot(u,w)||1;return[X+u/l*.7,Y+w/l*.7]};
const p0=ex(dx,dy),p1=ex(Q[b*2],Q[b*2+1]),p2=ex(Q[d*2],Q[d*2+1]);c.save();c.beginPath();c.moveTo(p0[0],p0[1]);c.lineTo(p1[0],p1[1]);c.lineTo(p2[0],p2[1]);c.closePath();c.clip();
c.transform(A,B,C,D,dx-A*sx-C*sy,dy-B*sx-D*sy);c.drawImage(L.img,0,0);c.restore()}}
function addLayer(img,name,bones){const L={name,img,w:img.naturalWidth,h:img.naturalHeight,x:P.W/2,y:P.H/2,rot:0,fx:1,fy:1,ar:1,op:1,bones:bones||[],r:[],keys:[],mesh:null};
L.s=Math.min(P.W*.8/L.w,P.H*.8/L.h);mk(L);layers.push(L);sel=layers.length-1;ui()}
function evalL(L,t){const k=L.keys;if(!k.length)return;const a=k[0],z=k[k.length-1],set=(p,q,e)=>{[['x',0],['y',0],['s',1],['rot',0],['ar',1],['op',1]].forEach(([n,d])=>{const a=p[n]??d,b=q[n]??d;L[n]=a+(b-a)*e});L.r=L.bones.map((_,i)=>(p.r[i]||0)+((q.r[i]||0)-(p.r[i]||0))*e)};

let AUTOK=true;const cur=()=>layers[sel];const keyNow=()=>{const L=cur();if(L){key(L,Math.round(f));L._pf=null}};const ak=()=>{const L=cur();if(!L)return;if(AUTOK)keyNow();else L._pf=Math.round(f)};
function marks(){const L=cur();$('mk').innerHTML=L?L.keys.map(k=>'<i style="left:'+k.f/(P.nf-1)*100+'%"></i>').join('')+(L.fbf&&L.fbf.fr?Object.keys(L.fbf.fr).map(Number).sort((a,b)=>a-b).map(n=>'<i class="fd" data-f="'+n+'" style="left:'+n/(P.nf-1)*100+'%"></i>').join(''):''):'';try{flRow()}catch(e){}}
function ui(){$('ly').innerHTML=layers.map((L,i)=>'<button data-i="'+i+'" class="'+(i===sel?'on':'')+'">'+L.name+'</button>').join('')||'<span style="opacity:.6">Add a PNG to begin</span>';
const L=cur();if(L){$('so').value=L.op*100;$('ss').value=L.s/Math.min(P.W*.8/L.w,P.H*.8/L.h)*100;$('sr').value=L.rot*180/Math.PI}marks();
$('bx').style.display=mode==='bones'?'flex':'none';
$('hint').textContent={move:'Drag the layer to move. Corners scale, side dots stretch, the top handle rotates.',pose:L&&L.bones.length?'Drag the blue dots to pose. '+(AUTOK?'Auto-keys on this frame.':'Auto-key is off. Tap Key to save.')+'':'This layer has no bones. Use Bones mode first.',bones:'Tap to place a joint, tap again for the bone end. Next taps continue the chain. Tap a dot to branch from it.'}[mode]}
function setP(){const[w,h]=$('as').value.split(',').map(Number);P.W=w;P.H=h;document.documentElement.style.setProperty('--r',w/h);P.nf=+$('nf').value;P.fps=+$('fp').value;P.bg=$('bg').value;$('fr').max=P.nf-1;if(f>P.nf-1)f=0;marks();wave()}

$('ly').onclick=e=>{const b=e.target.closest('button');if(b){sel=+b.dataset.i;selB=-1;rs=null;ui()}};

window.sMsg=function(m){var n=document.getElementById('hint');if(!n)return;n.textContent=m;clearTimeout(n._mt);n._mt=setTimeout(function(){if(n.textContent===m){try{ui()}catch(e){n.textContent=''}}},3500)};
window.imgErr=function(x){var f=x&&x.fmt?String(x.fmt).replace(/^image\//,'').toUpperCase()+' ':'';return x&&x.message==='heic'?'This device cannot open HEIC photos. Save or share it as JPG or PNG, then try again.':'Could not open that '+f+'image. Try saving it as PNG or JPG.'};
window.tmsg=function(id,def,ms){var t=0;return function(m){var e=document.getElementById(id);if(!e)return;e.textContent=m;clearTimeout(t);t=setTimeout(function(){if(e.textContent!==m)return;var d=typeof def==='function'?def():def;if(typeof d==='string')e.textContent=d},ms||3500)}};
window.loadImg=function(file,max){max=max||4096;
 var ext=((file.name||'').split('.').pop()||'').toLowerCase();
 var MT={png:'image/png',apng:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',jpe:'image/jpeg',jfif:'image/jpeg',pjpeg:'image/jpeg',pjp:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif',bmp:'image/bmp',dib:'image/bmp',svg:'image/svg+xml',svgz:'image/svg+xml',ico:'image/x-icon',cur:'image/x-icon',tif:'image/tiff',tiff:'image/tiff',heic:'image/heic',heif:'image/heif'};

  if(!(hw&&hh)){var vb=tag.match(/viewBox\s*=\s*["']\s*[-\d.eE]+[\s,]+[-\d.eE]+[\s,]+([\d.eE]+)[\s,]+([\d.eE]+)/i),w=vb?+vb[1]:1024,h=vb?+vb[2]:1024,k=1024/Math.max(w,h||1);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));nt=tag.replace(/\s(width|height)\s*=\s*("[^"]*"|'[^']*')/gi,'').replace(/<svg/i,'<svg width="'+w+'" height="'+h+'"')}

  c.width=cw;c.height=ch;c.getContext('2d').drawImage(draw,0,0,cw,ch);if(draw.close){try{draw.close()}catch(e){}}

<script>
/* ===== Studio Phase 3 module: Face and voice (lip sync) =====

const I=id=>document.getElementById(id);

const LET=['A','B','C','D','E','F','G','H','X'];const MN={A:'Closed',B:'Smile',C:'Open',D:'Wide',E:'Round',F:'Pucker',G:'F / V',H:'Tongue',X:'Rest'};

const glx=()=>{try{return $('gl').getContext('webgl')}catch(e){return null}};

/* ---------- default mouth drawings ---------- */
/* wid: width, o: openness, sm: smile, rd: round, th: teeth height, tg: tongue, ft: teeth over lower lip, tu: tongue up */
const SP={A:{wid:.62,o:0,sm:0,press:1},B:{wid:.82,o:.2,sm:.35,th:.9,clench:1},C:{wid:.68,o:.52,sm:.05,th:.35,tg:.5},D:{wid:.74,o:.95,sm:0,th:.28,tg:.8},
  E:{wid:.5,o:.62,rd:1,th:.12,tg:.5},F:{wid:.26,o:.42,rd:1,th:0,tg:.2},G:{wid:.7,o:.26,sm:.05,th:1,ft:1},H:{wid:.68,o:.5,sm:.04,th:.4,tg:.7,tu:1},X:{wid:.56,o:.05,sm:.04}};
function drawShape(z,l){const w=z.width,h=z.height,g=z.getContext('2d'),s=SP[l];g.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,hw=s.wid*w/2*.9,H=s.o*h*.62,lw=Math.max(6,h*.07),sm=(s.sm||0)*h*.16,y0=cy-sm,OUT='#3b0d16',LIP='#e0606e';

  g.save();path();const gr=g.createLinearGradient(0,tp,0,bt);gr.addColorStop(0,'#3a0a16');gr.addColorStop(1,'#7d1f30');g.fillStyle=gr;g.fill();g.clip();
  if(s.tg){const ty=s.tu?cy-H*.08:bt-H*.1,rx=hw*.58,ry=H*(s.tu?.24:.34)*s.tg+4;g.fillStyle='#ee7f8b';g.beginPath();g.ellipse(cx,ty+ry*.35,rx,ry,0,0,7);g.fill();g.strokeStyle='rgba(120,30,50,.45)';g.lineWidth=Math.max(2,h*.012);g.beginPath();g.moveTo(cx,ty-ry*.1);g.lineTo(cx,ty+ry*.8);g.stroke()}
  if(s.th){g.fillStyle='#fffdf6';const tH=s.clench?H+lw*2:(s.ft?H*.62:Math.max(h*.07,H*.36)*s.th);g.fillRect(cx-hw,tp-lw,hw*2,tH+lw);
    g.strokeStyle='rgba(110,90,90,.4)';g.lineWidth=Math.max(1.5,h*.009);g.beginPath();for(let k=1;k<6;k++){const x=cx-hw+hw*2*k/6;g.moveTo(x,tp);g.lineTo(x,tp+tH-lw*.4)}g.stroke();
    g.strokeStyle='rgba(150,120,120,.5)';g.beginPath();g.moveTo(cx-hw,tp+tH);g.lineTo(cx+hw,tp+tH);g.stroke();
    if(s.clench){g.strokeStyle='rgba(110,90,90,.55)';g.lineWidth=Math.max(2,h*.012);g.beginPath();g.moveTo(cx-hw,cy);g.lineTo(cx+hw,cy);g.stroke()}}
  g.restore();
  lip(path);
  if(s.ft){lip(()=>{g.beginPath();g.moveTo(cx-hw*.72,bt-H*.2);g.quadraticCurveTo(cx,bt+H*.35,cx+hw*.72,bt-H*.2)})}
  return z}

/* ---------- layer state ---------- */
function ensureLip(L){const q=L.lip;if(!q)return null;if(q.cv)return q;q.fw=q.fw||320;q.fh=q.fh||200;q.cues=q.cues||[];q.custom=q.custom||{};q.cv={};q.tx={};q.cur=null;q.src={};
  LET.forEach(l=>{q.cv[l]=drawShape(cnv(q.fw,q.fh),l)});
  Object.keys(q.custom).forEach(l=>{const im=new Image();im.onload=()=>{fitInto(q,l,im);inv(L,l)};im.src=q.custom[l]});return q}
function fitInto(q,l,im){const z=q.cv[l],g=z.getContext('2d'),w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,k=Math.min(z.width/w,z.height/h);g.clearRect(0,0,z.width,z.height);g.drawImage(im,(z.width-w*k)/2,(z.height-h*k)/2,w*k,h*k)}
function inv(L,l){const q=L.lip,x=glx();if(q.tx[l]){try{x&&x.deleteTexture(q.tx[l])}catch(e){}q.tx[l]=null}if(q.cur===l){if(L.tex)try{x&&x.deleteTexture(L.tex)}catch(e){}L.tex=null}}
function setShape(L,v){const q=L.lip;if(q.cur===v&&L.img===q.cv[v])return;if(q.cur&&L.tex)q.tx[q.cur]=L.tex;q.cur=v;L.img=q.cv[v];L.tex=q.tx[v]||null;L.src=null}
function cueAt(c,s){if(!c.length)return'X';let a=0,b=c.length-1;if(s<c[0].start)return'X';if(s>=c[b].end)return'X';
  while(a<b){const m=(a+b+1)>>1;if(c[m].start<=s)a=m;else b=m-1}return c[a].value}
{const _e=evalL;evalL=function(L,t){_e(L,t);if(L.lip){const q=ensureLip(L);let v;if(q.force&&!playing)v=q.force;else v=q.on===false?'X':cueAt(q.cues,(t-(q.of||0))/P.fps);setShape(L,LET.includes(v)?v:'X')}}}
window.lipS=L=>L.lip?{cues:L.lip.cues,on:L.lip.on,fw:L.lip.fw,fh:L.lip.fh,custom:L.lip.custom,of:L.lip.of||0,aname:L.lip.aname||''}:undefined;

/* ---------- audio analysis (in the browser, no server) ---------- */
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const u=i+k,v=i+k+len/2,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
function analyze(data,fs,sens){const N=1024,hop=Math.round(fs*.025),nf=Math.max(1,Math.floor((data.length-N)/hop)),win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  const re=new Float32Array(N),im=new Float32Array(N),F=[],rm=[];
  for(let f=0;f<nf;f++){const s=f*hop;let e=0;for(let i=0;i<N;i++){const v=data[s+i]||0;e+=v*v;re[i]=v*win[i];im[i]=0}const rms=Math.sqrt(e/N);rm.push(rms);
    fft(re,im);const bin=fs/N,sp=new Float32Array(N/2);for(let k=1;k<N/2;k++)sp[k]=Math.hypot(re[k],im[k]);
    for(let k=2;k<N/2-2;k++)sp[k]=(sp[k-1]+sp[k]+sp[k+1])/3;
    let tot=0,hf=0,p1=0,f1=0,p2=0,f2=0;for(let k=3;k<N/2-2;k++){const fr=k*bin,v=sp[k]*sp[k];if(fr>150&&fr<4000)tot+=v;if(fr>4000)hf+=v;

  const md=(a,i,k)=>{const t=[];for(let j=i-k;j<=i+k;j++)t.push(a[Math.min(a.length-1,Math.max(0,j))]);t.sort((x,y)=>x-y);return t[k]},F1=F.map(q=>q.f1),F2=F.map(q=>q.f2),HF=F.map(q=>q.hf),rm2=rm.map((v,i)=>(rm[Math.max(0,i-1)]+v+rm[Math.min(rm.length-1,i+1)])/3);
  F.forEach((q,i)=>{q.f1=md(F1,i,2);q.f2=md(F2,i,2);q.hf=md(HF,i,1)});
  const lab=F.map((q,i)=>{const r=rm2[i]/ref;if(r<th)return'X';
    if(q.hf>.5)return'B';if(q.hf>.34&&r<.4)return'G';
    let s;if(q.f1>650)s='D';else if(q.f1>520)s='C';else if(q.f2>1900)s='B';else if(q.f2<1100)s=q.f1<420?'F':'E';else s=q.f1>440?'H':'E';
    if(r<.3&&s==='D')s='C';return s});
  /* lips close for a moment between sounds (m, b, p) */
  for(let i=1;i<lab.length-1;){if(lab[i]==='X'){let j=i;while(j<lab.length&&lab[j]==='X')j++;if(i>0&&lab[i-1]!=='X'&&j<lab.length&&j-i<=3){for(let k=i;k<j;k++)lab[k]='A'}i=j}else i++}
  /* drop very short shapes */
  {let ch=true,ps=0;while(ch&&ps++<4){ch=false;let i=0;while(i<lab.length){let j=i;while(j<lab.length&&lab[j]===lab[i])j++;if(j-i<(lab[i]==='A'?2:3)&&i>0&&j<lab.length){for(let k=i;k<j;k++)lab[k]=lab[i-1];ch=true}i=j}}}

  return cues.filter(c=>c.end>c.start)}

/* ---------- UI ---------- */
const css=document.createElement('style');css.textContent='.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1 0 auto;padding:0 9px}#p-fc .row b{width:100%;font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:-2px}'+

  if(replace)L.keys=L.keys.filter(k=>!k[tag]);

<script>
/* ===== Studio Phase 4a module: Keys (keyframe editor) =====

(()=>{
/*CORE*/
const clampF=n=>Math.max(0,Math.min(P.nf-1,n));
const kAt=(L,fr)=>L.keys.find(k=>k.f===fr);

function speedKeys(L,fac){const m=new Map();L.keys.forEach(k=>{k.f=clampF(Math.round(k.f*fac));m.set(k.f,k)});L.keys=[...m.values()];sortK(L)}

  if(first.f>0)L.keys.unshift(cl(first,0));
  const old=kAt(L,end),c=cl(L.keys[0],end);if(old&&old!==L.keys[0])c.e=old.e||c.e;
  L.keys=L.keys.filter(q=>q.f!==end||q===L.keys[0]);if(end>0)L.keys.push(c);sortK(L);return true}

    const old=L.keys.find(q=>q.f===it.fr);key(L,it.fr);const k=L.keys.find(k=>k.f===it.fr);k[tag]=it.o||1;k.hm={x:b.x,y:b.y,s:b.s,rot:b.rot,ar:b.ar,op:b.op,r:b.r.slice()};k.e=it.e||'smooth';

 fadepulse:{g:'attn',t:'Fade pulse',n:8,c:1,f:(p,A)=>s=>SA(s,{op:cl(s.op*(1-Math.min(.9,.5*A)*(.5-.5*Math.cos(T*p))))})},

 nod:{g:'emo',t:'Nod',n:8,c:2,f:(p,A,R)=>s=>SA(s,{y:s.y+R*.8*Math.sin(T*p),rot:s.rot+A*3*D2R*Math.sin(T*p)})},

<script>
/* ===== Studio Phase 4c module: Squash (hands-on squash and stretch) =====
   Isolated: own tab. Drag on the picture (or use the slider) to squash and stretch the selected layer.
   Volume is kept (wider when squashed), the chosen anchor stays pinned. Keys are made by the
   app's Auto-key switch, or by the Key button. Only the optional "Quick hop" writes its own flagged keys (sq). */
(()=>{
/*CORE*/
const snap=L=>({x:L.x,y:L.y,s:L.s,rot:L.rot,ar:L.ar,op:L.op,r:L.r.slice()});
const clone=k=>JSON.parse(JSON.stringify(k));
function unflag(L,tag){const out=[];L.keys.forEach(k=>{if(!k[tag])out.push(k);else if(k.ov)out.push(k.ov)});return out.sort((a,b)=>a.f-b.f)}
function baseAt(L,fr,tag){const all=L.keys,own=all.filter(k=>k[tag]),rest=unflag(L,tag);
  if(rest.length){L.keys=rest;evalL(L,fr);const s=snap(L);L.keys=all;return s}
  if(own.length&&own[0].hm){const h=own[0].hm;return{x:h.x,y:h.y,s:h.s,rot:h.rot,ar:h.ar,op:h.op,r:h.r.slice()}}
  return snap(L)}
function applyKeys(L,tag,items,replace){const bases=items.map(it=>baseAt(L,it.fr,tag));
  if(replace)L.keys=unflag(L,tag);
  items.forEach((it,i)=>{const b=bases[i],s=it.mod(b);L.x=s.x;L.y=s.y;L.s=s.s;L.rot=s.rot;L.ar=s.ar;L.op=s.op;L.r=b.r.slice();
    const old=L.keys.find(q=>q.f===it.fr);key(L,it.fr);const k=L.keys.find(k=>k.f===it.fr);k[tag]=it.o||1;k.hm={x:b.x,y:b.y,s:b.s,rot:b.rot,ar:b.ar,op:b.op,r:b.r.slice()};k.e=it.e||'smooth';
    if(old){if(old[tag]){if(old.ov)k.ov=old.ov}else k.ov=clone(old)}})}
function clearKeys(L,tag){const own=L.keys.filter(k=>k[tag]);if(!own.length)return 0;const h=own[0].hm;L.keys=unflag(L,tag);
  if(!L.keys.length&&h){L.x=h.x;L.y=h.y;L.s=h.s;L.rot=h.rot;L.ar=h.ar;L.op=h.op;L.r=h.r.slice()}return own.length}
/* Y = vertical factor (<1 squash, >1 stretch). Width gets 1/Y so volume stays. (ax,ay) = anchor in pixels from layer centre. */
const sqMod=(Y,ax,ay,L,dy)=>s=>{const X=1/Y,n=Object.assign({},s,{s:s.s*X,ar:s.ar*Y/X}),w=L.w,h=L.h,fx=L.fx,fy=L.fy,
  M=q=>LM({rot:q.rot,s:q.s,fx,fy,ar:q.ar,x:q.x,y:q.y,w,h}),a=ap(M(s),w/2+ax,h/2+ay),b=ap(M(n),w/2+ax,h/2+ay);
  n.x+=a[0]-b[0];n.y+=a[1]-b[1]+(dy||0);return n};
/* Make proportions even again: keep the same "area", ar back to 1. */
const evenMod=(ax,ay,L)=>s=>{const n=Object.assign({},s,{s:Math.sqrt(s.s*s.s*s.ar),ar:1}),w=L.w,h=L.h,fx=L.fx,fy=L.fy,
  M=q=>LM({rot:q.rot,s:q.s,fx,fy,ar:q.ar,x:q.x,y:q.y,w,h}),a=ap(M(s),w/2+ax,h/2+ay),b=ap(M(n),w/2+ax,h/2+ay);n.x+=a[0]-b[0];n.y+=a[1]-b[1];return n};
const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
/* finger drag (stage units) -> vertical factor Y. Up/right = bigger along that axis. */
function dragY(dx,dy,L,b,axis){const c=Math.cos(b.rot),n=Math.sin(b.rot);
  if(axis==='x'){const sg=L.fx<0?-1:1,d=(dx*c+dy*n)*sg,W=Math.max(20,L.w*b.s);return 1/clampN(Math.exp(d/(.6*W)),.3,3)}
  const sg=L.fy<0?-1:1,d=(-dx*n+dy*c)*sg,H=Math.max(20,L.h*b.s*b.ar);return clampN(Math.exp(-d/(.6*H)),.3,3)}
const sliderY=(v,axis)=>{const k=clampN(1+v/100,.3,3);return axis==='x'?1/k:k};
/* Quick hop */
const sqY=(a,kind)=>kind==='squash'?1-a*.8:1+a;
function hopItems(fr,a,H,ax,ay,L){const u=P.fps/12,last=P.nf-1,m=new Map(),
  S=[[0,1,0],[2,sqY(a,'squash'),0],[4,sqY(a,'stretch'),-H*.35],[7,1+a*.3,-H],[10,sqY(a,'squash')*.97,0],[12,1+a*.2,0],[14,1,0]];
  S.forEach(([o,Y,dy])=>{const g=fr+Math.round(o*u);if(g<=last)m.set(g,[Y,dy])});
  return[...m].sort((p,q)=>p[0]-q[0]).map(([g,[Y,dy]])=>({fr:g,o:'sq',mod:sqMod(Y,ax,ay,L,dy)}))}
/*END CORE*/

const I=id=>document.getElementById(id),rf=()=>Math.round(f);
let anc='bottom',axis='y',dragOn=true,g=null,sb=null;
const css=document.createElement('style');css.textContent='#p-sq .row b{width:100%;font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:-2px}#p-sq .row .sl{flex:1 1 100%;margin:0}#p-sq .row .sl span{width:104px}#sq-st{color:var(--mu);font-size:12px;min-height:30px;margin:2px 0 6px}.panels:has(#p-sq:not([hidden])){height:min(46dvh,360px)!important}.tr{flex-wrap:wrap}';document.head.appendChild(css);
const nav=document.querySelector('.tabs'),tb=document.createElement('button');tb.className='tab';tb.dataset.t='sq';tb.textContent='Squash';const pT=nav.querySelector('.tab[data-t="pr"]')||nav.querySelector('.tab[data-t="an"]');if(pT)pT.after(tb);else nav.appendChild(tb);
const pn=document.createElement('div');pn.className='pn';pn.id='p-sq';pn.hidden=true;
pn.innerHTML=`<div id="sq-st"></div>
<div class="row"><button class="pri on" id="sq-on">Drag on picture: On</button><button id="sq-ax">Squash: up and down</button><button id="sq-rs">Even out shape</button></div>
<div class="row"><label class="sl"><span>Squash ⟷ Stretch</span><input type="range" id="sq-sl" min="-60" max="60" value="0"></label></div>
<div class="row"><b>Stays pinned at</b><div class="row" id="sq-an" style="width:100%"><button data-n="bottom" class="on">Bottom (feet)</button><button data-n="center">Center</button><button data-n="top">Top</button></div></div>
<div class="row"><b>Extra</b><button id="sq-hp">Quick hop</button><button id="sq-ch">Clear hop</button><label class="sl"><span>Hop height</span><input type="range" id="sq-h" min="2" max="15" value="6"></label></div>`;
document.querySelector('.panels').appendChild(pn);
const keyTxt=()=>AUTOK?'Auto-key is on, so a key is saved when you let go.':'Auto-key is off. Tap ◆ Key to save it.';
const st0=m=>{I('sq-st').textContent=m},st=tmsg('sq-st',()=>{try{idle()}catch(e){}});
function idle(){st0('Touch a part of the picture, then drag. Up stretches it, down squashes it. '+keyTxt())}
function commit(L,msg){if(AUTOK){key(L,rf());L._pf=null;marks();st(msg+' Key saved at frame '+rf()+'.')}else{L._pf=rf();st(msg+' Auto-key is off. Tap ◆ Key to save it.')}}
function anchorOf(L){let bb=[0,0,L.w,L.h];try{if(L._sqI!==L.img||L._sqW!==L.w||L._sqH!==L.h){L._sqB=bbox(L);L._sqI=L.img;L._sqW=L.w;L._sqH=L.h}bb=L._sqB}catch(e){}
  const cx=bb[0]+bb[2]/2-L.w/2,cy=bb[1]+bb[3]/2-L.h/2;return anc==='bottom'?[cx,bb[1]+bb[3]-L.h/2]:anc==='top'?[cx,bb[1]-L.h/2]:[cx,cy]}
function set(L,n){L.s=n.s;L.ar=n.ar;L.x=n.x;L.y=n.y}
const hc=document.createElement('canvas');hc.width=hc.height=1;const hg=hc.getContext('2d',{willReadFrequently:true});
function alphaAt(L,x,y){try{hg.clearRect(0,0,1,1);hg.drawImage(L.img,Math.floor(x),Math.floor(y),1,1,0,0,1,1);return hg.getImageData(0,0,1,1).data[3]}catch(e){return 255}}
function pickAt(q){for(let i=layers.length-1;i>=0;i--){const L=layers[i];if(L.op<.02||L.hid)continue;const l=ap(inv(LM(L)),q.x,q.y);
  if(l[0]>=0&&l[1]>=0&&l[0]<L.w&&l[1]<L.h&&alphaAt(L,l[0],l[1])>20)return i}return -1}
const txt=Y=>{const p=Math.round(Math.abs(Y-1)*100);return p<2?'Normal':(axis==='x'?(Y<1?'Wider ':'Thinner '):(Y<1?'Squashed ':'Stretched '))+p+'%.'};
cv.addEventListener('pointerdown',e=>{if(pn.hidden||!dragOn)return;if(typeof PTR!=='undefined'&&PTR.size>=2)return;
  const q=pt(e),i=pickAt(q);if(i>=0&&i!==sel){sel=i;ui()}const L=cur();if(!L)return;
  e.stopImmediatePropagation();e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}
  if(playing){playing=false;$('pl').textContent='Play';if(typeof AU!=='undefined'&&AU)AU.pause()}
  const[ax,ay]=anchorOf(L);g={id:e.pointerId,L,b:snap(L),q0:q,ax,ay,moved:false,Y:1}},true);
cv.addEventListener('pointermove',e=>{if(!g||e.pointerId!==g.id)return;e.stopImmediatePropagation();const q=pt(e),dx=q.x-g.q0.x,dy=q.y-g.q0.y;
  if(!g.moved&&Math.hypot(dx,dy)*q.k<6)return;g.moved=true;const L=g.L;L._pf=rf();g.Y=dragY(dx,dy,L,g.b,axis);set(L,sqMod(g.Y,g.ax,g.ay,L)(g.b));st(txt(g.Y))},true);
const up=e=>{if(!g||e.pointerId!==g.id)return;e.stopImmediatePropagation();const d=g;g=null;try{cv.releasePointerCapture(e.pointerId)}catch(x){}
  if(d.moved)commit(d.L,txt(d.Y));else{d.L._pf=null;idle()}};
cv.addEventListener('pointerup',up,true);cv.addEventListener('pointercancel',up,true);
I('sq-sl').addEventListener('input',e=>{const L=cur();if(!L)return;if(!sb){const[ax,ay]=anchorOf(L);sb={L,b:snap(L),ax,ay}}
  const Y=sliderY(+e.target.value,axis);sb.L._pf=rf();sb.Y=Y;set(sb.L,sqMod(Y,sb.ax,sb.ay,sb.L)(sb.b));st(txt(Y))});
I('sq-sl').addEventListener('change',e=>{const d=sb;sb=null;e.target.value=0;if(d&&Math.abs(d.Y-1)>.01)commit(d.L,txt(d.Y))});
I('sq-on').onclick=()=>{dragOn=!dragOn;I('sq-on').textContent='Drag on picture: '+(dragOn?'On':'Off');I('sq-on').classList.toggle('on',dragOn);st(dragOn?'Drag on the picture to squash.':'Drag is off, so you can move and pinch the picture normally.')};
I('sq-ax').onclick=()=>{axis=axis==='y'?'x':'y';I('sq-ax').textContent='Squash: '+(axis==='y'?'up and down':'side to side');idle()};
I('sq-an').onclick=e=>{const b=e.target.closest('button');if(!b)return;anc=b.dataset.n;[...I('sq-an').children].forEach(x=>x.classList.toggle('on',x===b))};
I('sq-rs').onclick=()=>{const L=cur();if(!L){st('Add a layer first');return}const[ax,ay]=anchorOf(L);set(L,evenMod(ax,ay,L)(snap(L)));commit(L,'Shape evened out.')};

  applyKeys(L,'sq',hopItems(fr,.25,I('sq-h').value/100*P.H,ax,ay,L),false);marks();st('Hop added at frame '+fr+'. Playing from here.');I('fr').value=fr;I('fr').dispatchEvent(new Event('input'));if(!playing)I('pl').click()};
I('sq-ch').onclick=()=>{const L=cur();const n=L?clearKeys(L,'sq'):0;marks();st(n?'Hop cleared':'No hop to clear')};
tb.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));document.querySelectorAll('.pn').forEach(p=>p.hidden=p.id!=='p-sq');
  try{const cc=window.StudioCutCore;cc&&cc.off&&cc.off()}catch(e){}try{window.StudioPose&&window.StudioPose.off&&window.StudioPose.off()}catch(e){}idle();ui();nav.scrollLeft=tb.offsetLeft-nav.clientWidth/2+tb.offsetWidth/2};
})();

<script>
/* ===== Studio Phase 5a module: Scene (Camera) =====
   Isolated: own tab. Data lives in P.cam = {keys:[{f,x,y,z,r}], cur:{x,y,z,r}} so save, load and autosave carry it.
   The camera is applied only inside GL.draw (a temporary shift of each layer, restored right after),
   so bones, deform, lip sync, eyes and keyframes are untouched. No keys + Camera view off = identical to before. */
(()=>{
const I=id=>document.getElementById(id),clampN=(v,a,b)=>Math.max(a,Math.min(b,v)),rf=()=>Math.round(f);
const dflt=()=>({x:P.W/2,y:P.H/2,z:1,r:0});
function C(){if(!P.cam||!P.cam.keys)P.cam={keys:[],cur:dflt()};if(!P.cam.cur)P.cam.cur=dflt();return P.cam}
let view=false,camF=0,hist=[],lastR=-1;
const ss=t=>t*t*(3-2*t);
function camAt(t){const k=C().keys;if(!k.length)return null;if(t<=k[0].f)return k[0];const z=k[k.length-1];if(t>=z.f)return z;
  let i=0;while(k[i+1].f<t)i++;const a=k[i],b=k[i+1],e=ss((t-a.f)/(b.f-a.f));
  return{x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,z:a.z+(b.z-a.z)*e,r:a.r+(b.r-a.r)*e}}
const tNow=()=>XP?camF:f;
function eff(){const c=C();return c.keys.length?camAt(tNow()):(view?c.cur:null)}
const active=()=>playing||XP||view;
/* history for the camera (own small undo) */
const snapC=()=>JSON.stringify(C());
function pushH(){const s=snapC();if(hist[hist.length-1]!==s){hist.push(s);if(hist.length>60)hist.shift()}}
/* keep track of the frame the render is for (needed by export) */
const e0=window.evalL;window.evalL=function(L,t){camF=t;return e0.apply(this,arguments)};
/* apply camera only while drawing */
if(typeof GL!=='undefined'&&GL){const d0=GL.draw;GL.draw=function(L,a){const c=active()?eff():null;if(!c)return d0.call(GL,L,a);
  const o=[L.x,L.y,L.s,L.rot],A=-c.r*Math.PI/180,co=Math.cos(A),si=Math.sin(A),px=L.x-c.x,py=L.y-c.y;
  L.x=c.z*(px*co-py*si)+P.W/2;L.y=c.z*(px*si+py*co)+P.H/2;L.s=L.s*c.z;L.rot=L.rot+A;
  try{return d0.call(GL,L,a)}finally{L.x=o[0];L.y=o[1];L.s=o[2];L.rot=o[3]}}}
/* UI */
const css=document.createElement('style');css.textContent='#p-sc .row b{width:100%;font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:-2px}#p-sc .row .sl{flex:1 1 100%;margin:0}#p-sc .row .sl span{width:64px}#sc-st{color:var(--mu);font-size:12px;min-height:30px;margin:2px 0 6px}.panels:has(#p-sc:not([hidden])){height:min(46dvh,360px)!important}#sc-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent!important}.tr{flex-wrap:wrap}';document.head.appendChild(css);
const nav=document.querySelector('.tabs'),tb=document.createElement('button');tb.className='tab';tb.dataset.t='sc';tb.textContent='Scene';nav.appendChild(tb);
const pn=document.createElement('div');pn.className='pn';pn.id='p-sc';pn.hidden=true;
pn.innerHTML=`<div id="sc-st"></div>
<div class="row"><b>Camera</b><button id="sc-vw">Camera view: Off</button><button class="pri" id="sc-ky">Key camera</button><button id="sc-pv">◀ Prev</button><button id="sc-nx">Next ▶</button><button id="sc-dl">Delete key</button></div>
<div class="row"><label class="sl"><span>Left/Right</span><input type="range" id="sc-x" min="0" max="100" value="50"></label><label class="sl"><span>Up/Down</span><input type="range" id="sc-y" min="0" max="100" value="50"></label><label class="sl"><span>Zoom</span><input type="range" id="sc-z" min="50" max="300" value="100"></label><label class="sl"><span>Rotate</span><input type="range" id="sc-r" min="-30" max="30" value="0"></label></div>
<div class="row"><b>Presets (whole project)</b><button id="sc-p1">Zoom in slow</button><button id="sc-p2">Zoom out slow</button><button id="sc-p3">Pan left</button><button id="sc-p4">Pan right</button><button id="sc-p5">Shake</button></div>
<div class="row"><button id="sc-un">Undo camera</button><button id="sc-rs">Reset camera</button></div>`;
document.querySelector('.panels').appendChild(pn);
const ov=document.createElement('canvas');ov.id='sc-ov';document.querySelector('.stage').appendChild(ov);
const st0=t=>{I('sc-st').textContent=t},st=tmsg('sc-st',()=>{try{sync()}catch(e){}});
function sync(){const c=C().cur;I('sc-x').value=c.x/P.W*100;I('sc-y').value=c.y/P.H*100;I('sc-z').value=c.z*100;I('sc-r').value=c.r;
  const n=C().keys.length;I('sc-vw').textContent='Camera view: '+(view?'On':'Off');I('sc-vw').classList.toggle('on',view);
  st0(n?n+' camera key'+(n===1?'':'s')+'. Moving a slider keys the camera at this frame.':'No camera keys. Set a view, then press Key camera, or use a preset.')}
function setKey(c,fr){const k=C().keys,o={f:fr,x:c.x,y:c.y,z:c.z,r:c.r},i=k.findIndex(q=>q.f===fr);if(i>=0)k[i]=o;else{k.push(o);k.sort((a,b)=>a.f-b.f)}}
function edit(){const c=C(),cu=c.cur;cu.x=I('sc-x').value/100*P.W;cu.y=I('sc-y').value/100*P.H;cu.z=I('sc-z').value/100;cu.r=+I('sc-r').value;
  if(c.keys.length)setKey(cu,rf());sync()}
['sc-x','sc-y','sc-z','sc-r'].forEach(id=>{I(id).addEventListener('pointerdown',pushH);I(id).oninput=edit});
I('sc-vw').onclick=()=>{view=!view;sync()};
I('sc-ky').onclick=()=>{pushH();setKey(C().cur,rf());sync();st('Camera keyed at frame '+rf()+'.')};
const go=fr=>{I('fr').value=fr;I('fr').dispatchEvent(new Event('input'))};
I('sc-nx').onclick=()=>{const k=C().keys.find(q=>q.f>rf());if(k)go(k.f);else st('No later camera key.')};
I('sc-pv').onclick=()=>{const k=C().keys.filter(q=>q.f<rf()).pop();if(k)go(k.f);else st('No earlier camera key.')};
I('sc-dl').onclick=()=>{const c=C(),i=c.keys.findIndex(q=>q.f===rf());if(i<0){st('No camera key on this frame.');return}pushH();c.keys.splice(i,1);sync()};
function preset(items){pushH();const c=C();c.keys=items.map(o=>Object.assign({},o));if(c.keys.length)c.cur=Object.assign({},c.keys[0]);view=true;go(0);sync();st('Preset added across the whole project. Camera view is on; press Play.')}
const L0=()=>P.nf-1,cx=()=>P.W/2,cy=()=>P.H/2;
I('sc-p1').onclick=()=>preset([{f:0,x:cx(),y:cy(),z:1,r:0},{f:L0(),x:cx(),y:cy(),z:1.4,r:0}]);
I('sc-p2').onclick=()=>preset([{f:0,x:cx(),y:cy(),z:1.4,r:0},{f:L0(),x:cx(),y:cy(),z:1,r:0}]);

<script>/* ===== Rig pack: Import rig / Export rig / Ask Claude (.animorig, rig only: pieces + joints + bones, no keyframes) ===== */
(function(){
const MAXCH=45e6,MAXP=40,MAXDIM=4096;
const num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d;
const pt=a=>Array.isArray(a)&&a.length===2&&a.every(v=>typeof v==='number'&&isFinite(v));
let tT=0;const tell=m=>{let t=document.getElementById('rp-toast');if(!t){t=document.createElement('div');t.id='rp-toast';t.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:88vw;z-index:2147483000;background:rgba(15,17,23,.96);color:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.35;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.45);pointer-events:none';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(()=>{t.style.display='none'},3500)};
const clone=o=>JSON.parse(JSON.stringify(o));const RJ=()=>{if(!window.anRigJoin)throw new Error('Rig tools are not ready yet.');return window.anRigJoin};
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

function exportRig(){
 if(!layers.length){tell('Nothing to export yet.');return}
 const idx=new Map(layers.map((L,i)=>[L,i]));
 const pieces=layers.map(L=>{
  const k=L.keys&&L.keys.length?L.keys[0]:null,s=k||L,o={name:L.name||'Piece',png:srcOf(L)};
  const jt=RJ().alive(L)&&L.pv?L.jn:null;
  if(jt&&idx.has(jt.p))o.jn={pi:idx.get(jt.p),b:jt.b,pl:clone(jt.pl),ps0:jt.ps0,lk:!!jt.lk,rr:k?k.rot:L._rr,rs:k?k.s:L._rs};
  let x=s.x,y=s.y;if(!o.jn&&L.pv&&k){const c=RJ().cOf(L,k,L.pv);x=c[0];y=c[1]}
  Object.assign(o,{x,y,s:num(s.s,1),rot:num(s.rot,0),ar:num(s.ar,1),op:num(s.op,1),fx:L.fx<0?-1:1,fy:L.fy<0?-1:1,bones:clone(L.bones||[]),pins:clone(L.pins||[])});
  if(L.pv)o.pv=clone(L.pv);
  return o});
 const nm=(($('pm-nm')||{}).value||'character').trim()||'character';
 const blob=new Blob([JSON.stringify({animorig:1,name:nm,ref:{w:P.W,h:P.H},pieces})],{type:'application/json'});
 download(nm.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.animorig',blob);
 tell('Rig exported: '+pieces.length+' piece'+(pieces.length>1?'s':'')+'.')}

const loadImg=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('bad image'));im.src=src});

async function importRig(txt){
 if(txt.length>MAXCH)throw new Error('This rig file is too big.');
 let d;try{d=JSON.parse(txt)}catch(e){throw new Error('This file is not a rig pack.')}
 if(!d||d.animorig!==1||!Array.isArray(d.pieces)||!d.pieces.length)throw new Error('This is not an Animo rig pack.');
 if(d.pieces.length>MAXP)throw new Error('Too many pieces (max '+MAXP+').');
 const ref=d.ref&&num(d.ref.w,0)>0&&num(d.ref.h,0)>0?{w:d.ref.w,h:d.ref.h}:{w:P.W,h:P.H};
 const same=Math.abs(ref.w/ref.h-P.W/P.H)<.01,k=same?P.W/ref.w:Math.min(P.W*.8/ref.w,P.H*.8/ref.h);
 const toW=(x,y)=>[P.W/2+(x-ref.w/2)*k,P.H/2+(y-ref.h/2)*k];
 const nmS=new Set(d.pieces.map(o=>String(o&&o.name||'').slice(0,40)));{const dup=layers.filter(L=>nmS.has(L.name)).length;if(dup>=Math.ceil(d.pieces.length/2)&&confirm('This rig is already in your project.\n\nOK = replace it\nCancel = add another copy')){for(let i=layers.length-1;i>=0;i--)if(nmS.has(layers[i].name))layers.splice(i,1)}}
 const base=layers.length,n=d.pieces.length,out=[],jobs=[];
 for(let i=0;i<n;i++){
  const o=d.pieces[i],nm=String(o&&o.name||'Piece '+(i+1)).slice(0,40);
  if(!o||typeof o.png!=='string'||!/^data:image\/(png|webp|jpeg);base64,/.test(o.png))throw new Error('Piece "'+nm+'" has no picture.');
  let im;try{im=await loadImg(o.png)}catch(e){throw new Error('Piece "'+nm+'" picture could not be read.')}
  if(!im.naturalWidth||im.naturalWidth>MAXDIM||im.naturalHeight>MAXDIM)throw new Error('Piece "'+nm+'" picture is too large.');
  const bones=Array.isArray(o.bones)?o.bones:[];
  bones.forEach((b,j)=>{if(!b||!Number.isInteger(b.p)||b.p<-1||b.p>=j||!pt(b.a)||!pt(b.e))throw new Error('Piece "'+nm+'" has a bad bone.')});
  const w=toW(num(o.x,ref.w/2),num(o.y,ref.h/2));
  const L={name:nm,img:im,w:im.naturalWidth,h:im.naturalHeight,x:w[0],y:w[1],rot:num(o.rot,0),s:num(o.s,1)*k,fx:o.fx<0?-1:1,fy:o.fy<0?-1:1,ar:num(o.ar,1),op:Math.max(0,Math.min(1,num(o.op,1))),
   bones:clone(bones),r:bones.map(()=>0),keys:[],mesh:null,pins:Array.isArray(o.pins)?clone(o.pins):[]};
  if(pt(o.pv))L.pv=o.pv.slice();
  const j=o.jn;
  if(j&&L.pv&&Number.isInteger(j.pi)&&j.pi>=0&&j.pi<n&&j.pi!==i&&pt(j.pl))
   L.jn={pi:base+j.pi,b:Number.isInteger(j.b)?j.b:-1,pl:j.pl.slice(),ps0:num(j.ps0,1)*k,lk:!!j.lk,rr:num(j.rr,0),rs:num(j.rs,1)*k};
  else if(Number.isInteger(o.parent)&&o.parent>=0&&o.parent<n&&o.parent!==i)
   jobs.push({i,p:o.parent,at:pt(o.at)?toW(o.at[0],o.at[1]):null,lk:!!o.lock});
  out.push(L)}
 out.forEach(L=>{mk(L)});
 layers.push(...out);
 jobs.forEach(J=>{const C=layers[base+J.i],Pp=layers[base+J.p];if(!C||!Pp)return;
  if(J.at)RJ().joinAt(C,Pp,J.at,J.lk);else RJ().join(C,Pp,J.lk)});
 sel=base;try{if(out.some(L=>L.bones.length)&&mode!=='pose'){const mp=document.getElementById('m-pose');if(mp)mp.click()}}catch(e){}ui();push();
 return out.length}

const inp=document.createElement('input');inp.type='file';inp.style.display='none';document.body.appendChild(inp);
inp.onchange=async()=>{const f=inp.files&&inp.files[0];inp.value='';if(!f||window.__rigBusy)return;window.__rigBusy=1;
 try{const c=await importRig(await f.text());tell('Rig imported: '+c+' piece'+(c>1?'s':'')+'. Drag the dots to pose it.')}catch(e){tell(e.message||'Could not import this file.')}finally{window.__rigBusy=0}};

const PROMPT=`Please rig my character for the Animo animation app using BONES, not cut-out pieces. Make me ONE file called character.animorig that I can import in Animo (Rig tab > Import rig).

IMPORTANT
Do NOT cut the character into parts and do NOT use parents or hinges. The whole character stays as ONE picture. All the posing comes from a bone skeleton that you place on top of it.

STEPS
1. Using code (Python with PIL and numpy), crop my character tightly with a transparent background, copying the real pixels. Do not redraw or restyle anything. If the background is a flat colour, remove it carefully without damaging the character. Longest side at most 1600 px.
2. Place a bone skeleton on the cropped picture. Draw the bones and joint dots on a preview image, look at it, and fix any joint that is not on the right body spot (neck, head, shoulders, elbows, wrists, hips, knees, ankles).
3. Write the file as JSON in exactly this format:

{
  "animorig": 1,
  "name": "Character name",
  "ref": {"w": <width of my original image>, "h": <height of my original image>},
  "pieces": [
    {
      "name": "Character",
      "png": "data:image/png;base64,....",
      "x": <x of the CENTRE of the cropped picture in the original image, in pixels>,
      "y": <y of the CENTRE of the cropped picture in the original image, in pixels>,
      "bones": [
        {"p": -1, "a": [<x>, <y>], "e": [<x>, <y>]},
        {"p": 0, "a": [<x>, <y>], "e": [<x>, <y>]}
      ]
    }
  ]
}

RULES
- There is exactly ONE piece. No "parent" field and no "at" field.
- Every bone point (a = where the bone starts, e = where it ends) is in pixels of the CROPPED picture, measured from its top-left corner. Not the original image.
- "p" is the position (starting at 0) of the bone's parent bone in the bones list, or -1 for the root bone. A parent always comes BEFORE its children in the list.
- A child bone must start exactly at the END point of its parent bone (its "a" equals the parent's "e"). Several children may start from the same parent end. That is how the skeleton branches.
- Start with a short root bone at the pelvis. Then bones for the spine, neck and head, each arm (upper arm, forearm, hand) and each leg (upper leg, lower leg, foot). Add hair, tail or cape bones only if they are clearly there. Use between 12 and 30 bones.
- Keep every joint inside the body, on the real hinge spot.
- Do not add keyframes or any other fields. Keep the file under 15 MB. Save it as character.animorig (plain JSON text).

CHECK BEFORE YOU SEND
Reload the file, draw the bones on the picture again and look at it. Every joint must sit on the right body spot and every parent index must be valid. Then send me the file and list the bones in order.`;

const PROMPT_CUT=`Please rig my character for the Animo animation app. Make me ONE file called character.animorig that I can import in Animo (Rig tab > Import rig).

STEPS
1. Look at my attached character image. Using code (Python with PIL and numpy), cut the character into separate pieces with transparent backgrounds, copying the real pixels from my image. Do not redraw or restyle anything. Typical pieces for a person: head, hair or hat if separate, torso, upper arm, lower arm, hand (left and right), upper leg, lower leg, foot (left and right). Use as many or as few pieces as this character needs. Let each piece extend a little under the piece it connects to, so there are no gaps when it moves.
2. Pick the hinge point where each piece attaches to its parent piece (neck, shoulder, elbow, wrist, hip, knee, ankle). Draw those points on a preview image, look at it, and fix any that are not on the right spot.
3. Write the file as JSON in exactly this format:

{
  "animorig": 1,
  "name": "Character name",
  "ref": {"w": <width of my original image>, "h": <height of my original image>},
  "pieces": [
    {
      "name": "Torso",
      "png": "data:image/png;base64,....",
      "x": <x of the CENTRE of this piece's box in the original image, in pixels>,
      "y": <y of the CENTRE of this piece's box in the original image, in pixels>,
      "parent": <index of the piece it hinges on, or null for the root piece>,
      "at": [<x>, <y>]
    }
  ]
}

RULES
- "png" is the cropped piece with a transparent background, as a base64 data URL. Crop tightly to the piece. Longest side at most 800 px.
- x and y are the centre of the piece's tight crop box (left + width/2, top + height/2), measured on the ORIGINAL image.
- "at" is the hinge point in ORIGINAL image pixels. Give it for every piece that has a parent.
- "parent" is the position (starting at 0) of the parent piece in the pieces list. Exactly one piece (usually the torso) has parent null. A piece is never its own parent and parents never loop.
- List pieces back to front: the first piece is drawn at the back.
- Do not add keyframes, animation, or any other fields. Keep the file under 15 MB.
- Save it as character.animorig (plain JSON text).

CHECK BEFORE YOU SEND
Reload the file, put the pieces back on a blank canvas of the original size at their x and y, and look at the result. It must look like my original character. Also check every parent index is valid. Then send me the file and tell me which piece is the root.`;
